<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gully Scores</title>

<!-- PWA / installable app setup -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#211F1C">
<link rel="icon" href="./icon-192.png">

<!-- iOS: Add to Home Screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gully Scores">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- Firebase (free cloud database for live sync between phones) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

:root{
  --tar:#211F1C;
  --concrete:#E7E2D4;
  --paper:#FBF8F0;
  --brick:#A63D24;
  --brick-dark:#7E2E1B;
  --chalk:#E4B03E;
  --pitch:#5C6B3F;
  --line:#C7BFA9;
  --line-soft:#DBD5C4;
  --muted:#77705F;
  --font-d:'Anton', 'Arial Narrow', sans-serif;
  --font-b:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--concrete);
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px);
  background-size: 100% 34px;
  color:var(--tar);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:transparent;
  padding:0 0 40px 0;
  position:relative;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 10px 20px;
}
.brand{
  font-family:var(--font-d);
  font-size:22px;
  letter-spacing:0.5px;
  color:var(--tar);
  cursor:pointer;
  line-height:1;
}
.brand span{color:var(--brick);}
.codepill{
  font-family:var(--font-b);
  font-weight:700;
  font-size:12px;
  background:var(--tar);
  color:var(--paper);
  padding:6px 10px;
  border-radius:3px;
  letter-spacing:1.5px;
  cursor:pointer;
  border:none;
}
.section{padding:8px 20px 0 20px;}

/* Hero */
.hero{padding:36px 20px 10px 20px;}
.hero h1{
  font-family:var(--font-d);
  font-size:58px;
  line-height:0.92;
  margin:0;
  color:var(--tar);
}
.hero h1 .out{
  -webkit-text-stroke:2px var(--tar);
  color:transparent;
}
.hero h1 .fill{color:var(--brick);}
.hero p{
  font-size:15px;
  color:var(--muted);
  max-width:320px;
  margin:14px 0 28px 0;
  line-height:1.5;
}
.stack{display:flex;flex-direction:column;gap:10px;}

/* buttons */
.btn{
  font-family:var(--font-b);
  font-weight:700;
  font-size:15px;
  padding:16px 18px;
  border-radius:4px;
  border:2px solid var(--tar);
  background:var(--paper);
  color:var(--tar);
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:transform .08s ease;
}
.btn:active{transform:scale(0.98);}
.btn.primary{background:var(--brick);border-color:var(--brick);color:var(--paper);}
.btn.primary:hover{background:var(--brick-dark);}
.btn .sub{display:block;font-weight:400;font-size:12.5px;color:inherit;opacity:0.75;margin-top:3px;}
.btn-small{
  font-family:var(--font-b);font-weight:600;font-size:13px;padding:9px 14px;border-radius:4px;
  border:2px solid var(--tar);background:var(--paper);color:var(--tar);cursor:pointer;
}
.btn-small.ghost{border-color:var(--line);color:var(--muted);}
.btn-full{width:100%;}

/* forms */
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);margin:18px 0 6px 0;}
input[type=text],input[type=number],textarea{
  width:100%;
  font-family:var(--font-b);
  font-size:16px;
  padding:12px 12px;
  border:2px solid var(--line);
  border-radius:4px;
  background:var(--paper);
  color:var(--tar);
}
input:focus,textarea:focus{outline:none;border-color:var(--brick);}
textarea{resize:vertical;min-height:90px;line-height:1.6;}
.hint{font-size:12px;color:var(--muted);margin-top:5px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* card / ledger */
.card{
  background:var(--paper);
  border:2px solid var(--tar);
  border-radius:6px;
  padding:18px;
  margin:14px 0;
}
.ledger-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.ledger-row:last-child{border-bottom:none;}

/* scoreboard */
.scoreboard{
  background:var(--tar);
  color:var(--paper);
  border-radius:6px;
  padding:22px 20px;
  margin:16px 20px 10px 20px;
}
.sb-teams{font-size:12px;letter-spacing:0.5px;color:#C9C2AE;margin-bottom:2px;}
.sb-score{font-family:var(--font-d);font-size:52px;line-height:1;display:flex;align-items:baseline;gap:10px;}
.sb-score .ov{font-family:var(--font-b);font-size:15px;font-weight:600;color:#C9C2AE;}
.sb-meta{display:flex;gap:18px;margin-top:10px;font-size:13px;color:#C9C2AE;flex-wrap:wrap;}
.sb-meta b{color:var(--chalk);font-weight:700;}
.sb-target{margin-top:10px;padding-top:10px;border-top:1px solid #45403A;font-size:13px;color:var(--chalk);font-weight:600;}

.batbowl{padding:0 20px;margin-top:4px;}
.bb-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
.bb-name{font-weight:600;}
.bb-name.striker::after{content:" *";color:var(--brick);font-weight:800;}
.bb-stat{color:var(--muted);font-variant-numeric:tabular-nums;}

.overstrip{display:flex;gap:6px;padding:14px 20px 4px 20px;flex-wrap:wrap;}
.ball-chip{
  min-width:30px;height:30px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  background:var(--paper);border:2px solid var(--line);color:var(--tar);
}
.ball-chip.four{background:var(--chalk);border-color:var(--chalk);}
.ball-chip.six{background:var(--pitch);border-color:var(--pitch);color:var(--paper);}
.ball-chip.wicket{background:var(--brick);border-color:var(--brick);color:var(--paper);}
.ball-chip.extra{background:var(--paper);border-color:var(--tar);border-style:dashed;}

/* pad */
.pad{padding:16px 20px 4px 20px;}
.pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.pad-btn{
  font-family:var(--font-d);
  font-size:26px;
  padding:16px 0;
  background:var(--paper);
  border:2px solid var(--tar);
  border-radius:5px;
  color:var(--tar);
  cursor:pointer;
}
.pad-btn:active{background:var(--tar);color:var(--paper);}
.pad-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
.pad-row .pad-btn{font-family:var(--font-b);font-weight:700;font-size:13px;padding:12px 0;}
.pad-row .pad-btn.out{color:var(--brick);border-color:var(--brick);}
.pad-row .pad-btn.out:active{background:var(--brick);color:var(--paper);}
.pad-actions{display:flex;gap:8px;margin-top:4px;}

.subpanel{
  margin:10px 20px 0 20px;padding:14px;background:var(--paper);
  border:2px dashed var(--brick);border-radius:6px;
}
.subpanel h4{margin:0 0 10px 0;font-size:13px;text-transform:uppercase;letter-spacing:0.6px;color:var(--brick);}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.chip-opt{
  font-family:var(--font-b);font-weight:600;font-size:13px;padding:10px 14px;
  border:2px solid var(--tar);border-radius:4px;background:var(--paper);cursor:pointer;
}
.chip-opt:active{background:var(--tar);color:var(--paper);}

/* footer nav */
.footnav{padding:18px 20px 0 20px;display:flex;gap:10px;flex-wrap:wrap;}

/* result */
.result-banner{
  margin:16px 20px;padding:22px;background:var(--pitch);color:var(--paper);
  border-radius:6px;text-align:left;
}
.result-banner .tag{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#D9E0C8;margin-bottom:6px;}
.result-banner h2{font-family:var(--font-d);font-size:28px;margin:0;line-height:1.15;}

table.figs{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
table.figs th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:2px solid var(--tar);}
table.figs td{padding:7px 4px;border-bottom:1px solid var(--line-soft);}
table.figs td.num,table.figs th.num{text-align:right;font-variant-numeric:tabular-nums;}
.section-title{font-family:var(--font-d);font-size:20px;margin:22px 20px 4px 20px;color:var(--tar);}

.playerlist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.playerlist button{
  text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:5px;background:var(--paper);
  font-family:var(--font-b);font-weight:600;font-size:14px;cursor:pointer;
}
.playerlist button:active{border-color:var(--brick);background:#FBF0E9;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--tar);color:var(--paper);padding:10px 18px;border-radius:5px;font-size:13px;
  z-index:50;max-width:90%;text-align:center;
}
.muted{color:var(--muted);}
.center{text-align:center;}
.small{font-size:12px;}
.error{color:var(--brick);font-size:13px;margin-top:6px;font-weight:600;}
.loading{padding:60px 20px;text-align:center;color:var(--muted);font-family:var(--font-d);font-size:20px;}
.livepulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pitch);margin-right:6px;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">loading…</div></div>

<script>
(function(){
"use strict";

/* ---------------- FIREBASE CONFIG ----------------
   Paste your own config here (from Firebase Console > Project settings > your web app).
   This is safe to leave visible in the HTML — it's just a project pointer, not a secret key. */
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){ console.error('Firebase not configured yet', e); }

/* ---------------- storage helpers (Firestore) ---------------- */
async function getMatch(code){
  if(!db) return null;
  try{
    const doc = await db.collection('matches').doc(code).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.error(e); return null; }
}
async function saveMatch(m){
  if(!db) return false;
  m.updatedAt = Date.now();
  try{
    await db.collection('matches').doc(m.code).set(m);
    return true;
  }catch(e){ console.error(e); return false; }
}
function watchMatch(code, onChange){
  if(!db) return ()=>{};
  return db.collection('matches').doc(code).onSnapshot(doc=>{
    if(doc.exists) onChange(doc.data());
  });
}

function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXY23456789';
  let c='';
  for(let i=0;i<5;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- global state ---------------- */
const state = {
  screen:'home',
  code:null,
  match:null,
  isScorer:false,
  err:'',
  toast:'',
  draft:{},
  pending:null,
  pollTimer:null
};

function toast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=''; render(); }, 2200);
}

function goHome(){
  stopPoll();
  state.screen='home'; state.code=null; state.match=null; state.isScorer=false; state.err=''; state.pending=null;
  render();
}

function stopPoll(){
  if(state.pollTimer){ state.pollTimer(); state.pollTimer=null; } // unsubscribe
}
function startWatchPoll(){
  stopPoll();
  if(!state.code) return;
  state.pollTimer = watchMatch(state.code, (fresh)=>{
    state.match = fresh; render();
  });
}

/* ---------------- innings helpers ---------------- */
function curInnings(){
  if(!state.match) return null;
  return state.match.innings[state.match.currentInnings];
}
function battingTeam(inn){ return state.match[ inn.battingTeam==='A' ? 'teamA' : 'teamB' ]; }
function bowlingTeam(inn){ return state.match[ inn.bowlingTeam==='A' ? 'teamA' : 'teamB' ]; }

function oversStr(legalBalls){
  return Math.floor(legalBalls/6) + '.' + (legalBalls%6);
}
function runRate(runs, legalBalls){
  if(legalBalls===0) return '0.00';
  return (runs / (legalBalls/6)).toFixed(2);
}

function snapshot(inn){
  // shallow-deep clone for undo (cap history length)
  if(!inn._history) inn._history=[];
  const clone = JSON.parse(JSON.stringify(inn));
  delete clone._history;
  inn._history.push(clone);
  if(inn._history.length>8) inn._history.shift();
}

function newBatsman(name){
  return {runs:0, balls:0, fours:0, sixes:0, out:false, howOut:'', bowler:'', fielder:''};
}
function newBowler(){
  return {legalBalls:0, runs:0, wickets:0};
}

function ensureBatsman(inn,name){
  if(!inn.batsmen[name]) inn.batsmen[name]=newBatsman(name);
}
function ensureBowler(inn,name){
  if(!inn.bowlers[name]) inn.bowlers[name]=newBowler();
}

function checkInningsEnd(inn, teamSize){
  const oversLimit = state.match.overs*6;
  if(inn.wickets >= teamSize-1) return true;
  if(inn.legalBalls >= oversLimit) return true;
  if(inn.target!=null && inn.totalRuns >= inn.target) return true;
  return false;
}

function finishInningsIfNeeded(){
  const inn = curInnings();
  const teamSize = battingTeam(inn).players.length;
  if(checkInningsEnd(inn, teamSize)){
    inn.completed = true;
    if(state.match.currentInnings===0){
      state.match.status='break';
    } else {
      finalizeMatch();
    }
  }
}

function finalizeMatch(){
  const inn0 = state.match.innings[0];
  const inn1 = state.match.innings[1];
  const t0name = battingTeam(inn0).name;
  const t1name = battingTeam(inn1).name;
  let res='';
  if(inn1.totalRuns >= inn0.totalRuns+1){
    const teamSize = battingTeam(inn1).players.length;
    const wLeft = (teamSize-1) - inn1.wickets;
    res = t1name+' won by '+wLeft+' wicket'+(wLeft===1?'':'s');
  } else if(inn1.totalRuns < inn0.totalRuns){
    const diff = inn0.totalRuns - inn1.totalRuns;
    res = t0name+' won by '+diff+' run'+(diff===1?'':'s');
  } else {
    res = 'Match tied';
  }
  state.match.result = res;
  state.match.status='completed';
}

/* ---------------- scoring actions ---------------- */
async function addRuns(n){
  const inn = curInnings();
  if(!inn || inn.completed) return;
  snapshot(inn);
  const striker = inn.striker, bowler = inn.currentBowler;
  ensureBatsman(inn,striker); ensureBowler(inn,bowler);
  inn.batsmen[striker].runs += n;
  inn.batsmen[striker].balls += 1;
  if(n===4) inn.batsmen[striker].fours+=1;
  if(n===6) inn.batsmen[striker].sixes+=1;
  inn.bowlers[bowler].runs += n;
  inn.bowlers[bowler].legalBalls += 1;
  inn.totalRuns += n;
  inn.legalBalls += 1;
  logBall(inn, {runs:n, extra:null, wicket:null, disp:String(n)});
  if(n%2===1) swapStrike(inn);
  handleOverBoundary(inn);
  finishInningsIfNeeded();
  await persistAndRender();
}

function swapStrike(inn){
  const t = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = t;
}

function handleOverBoundary(inn){
  if(inn.legalBalls>0 && inn.legalBalls%6===0 && !inn.completed){
    swapStrike(inn);
    inn.thisOver = [];
    inn.previousBowler = inn.currentBowler;
    inn.needNewBowler = true;
  }
}

function logBall(inn, data){
  if(!inn.balls) inn.balls=[];
  if(!inn.thisOver) inn.thisOver=[];
  inn.balls.push(data);
  inn.thisOver.push(data);
}

async function addExtra(type, addRunsVal){
  const inn = curInnings();
  if(!inn || inn.completed) return;
  snapshot(inn);
  const striker = inn.striker, bowler = inn.currentBowler;
  ensureBatsman(inn,striker); ensureBowler(inn,bowler);
  let total = 1 + addRunsVal;
  if(type==='WD'){
    inn.extras.wd += total;
    inn.totalRuns += total;
    inn.bowlers[bowler].runs += total;
    logBall(inn, {runs:0, extra:{type:'WD', runs:total}, wicket:null, disp:'wd'+(total>1?('+'+(total-1)):'')});
  } else if(type==='NB'){
    inn.extras.nb += 1;
    inn.totalRuns += total;
    inn.bowlers[bowler].runs += total;
    if(addRunsVal>0){ inn.batsmen[striker].runs += addRunsVal; if(addRunsVal===4) inn.batsmen[striker].fours+=1; if(addRunsVal===6) inn.batsmen[striker].sixes+=1; }
    logBall(inn, {runs:0, extra:{type:'NB', runs:total}, wicket:null, disp:'nb'+(addRunsVal>0?('+'+addRunsVal):'')});
    if(addRunsVal%2===1) swapStrike(inn);
  } else if(type==='B' || type==='LB'){
    const r = addRunsVal; // legal ball, runs to extras not batsman
    inn.extras[type.toLowerCase()] += r;
    inn.totalRuns += r;
    inn.legalBalls += 1;
    inn.bowlers[bowler].legalBalls += 1;
    inn.batsmen[striker].balls += 1;
    logBall(inn, {runs:0, extra:{type:type, runs:r}, wicket:null, disp:type.toLowerCase()+(r>0?(' '+r):'')});
    if(r%2===1) swapStrike(inn);
    handleOverBoundary(inn);
  }
  finishInningsIfNeeded();
  await persistAndRender();
}

async function confirmWicket(type, whoOut){
  const inn = curInnings();
  if(!inn || inn.completed) return;
  snapshot(inn);
  const bowler = inn.currentBowler;
  ensureBowler(inn,bowler);
  const outName = whoOut==='striker' ? inn.striker : inn.nonStriker;
  ensureBatsman(inn,outName);
  inn.batsmen[outName].out = true;
  inn.batsmen[outName].howOut = type;
  if(type!=='Run Out'){
    inn.batsmen[outName].balls += 1;
    inn.bowlers[bowler].legalBalls += 1;
    inn.bowlers[bowler].wickets += 1;
    inn.legalBalls += 1;
  } else {
    inn.batsmen[outName].balls += 1;
    inn.legalBalls += 1;
    inn.bowlers[bowler].legalBalls += 1;
  }
  inn.wickets += 1;
  logBall(inn, {runs:0, extra:null, wicket:{type:type, who:outName}, disp:'W'});
  state.pending = null;

  const teamSize = battingTeam(inn).players.length;
  if(checkInningsEnd(inn, teamSize)){
    handleOverBoundaryIfMidOverSkipSwap(inn);
    finishInningsIfNeeded();
    await persistAndRender();
    return;
  }
  // need new batsman
  const pool = battingTeam(inn).players.filter(p=>!inn.battingOrder.includes(p));
  if(pool.length===0){
    finishInningsIfNeeded();
    await persistAndRender();
    return;
  }
  handleOverBoundary(inn);
  state.pending = {type:'NEWBAT', outEnd: whoOut, pool: pool};
  await persistAndRender();
}
function handleOverBoundaryIfMidOverSkipSwap(inn){ /* no-op helper kept for clarity */ }

async function pickNewBatsman(name){
  const inn = curInnings();
  const outEnd = state.pending.outEnd;
  if(outEnd==='striker') inn.striker = name; else inn.nonStriker = name;
  inn.battingOrder.push(name);
  ensureBatsman(inn, name);
  state.pending = null;
  await persistAndRender();
}

async function pickNewBowler(name){
  const inn = curInnings();
  inn.currentBowler = name;
  inn.needNewBowler = false;
  ensureBowler(inn, name);
  await persistAndRender();
}

async function undoLast(){
  const inn = curInnings();
  if(!inn || !inn._history || inn._history.length===0){ toast('Nothing to undo'); return; }
  const prev = inn._history.pop();
  prev._history = inn._history;
  state.match.innings[state.match.currentInnings] = prev;
  state.pending = null;
  await persistAndRender();
}

async function persistAndRender(){
  await saveMatch(state.match);
  render();
}

/* ---------------- setup / toss flows ---------------- */
async function createMatch(){
  const d = state.draft;
  const teamAName = (d.teamA||'').trim() || 'Team A';
  const teamBName = (d.teamB||'').trim() || 'Team B';
  const playersA = (d.playersA||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const playersB = (d.playersB||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const overs = parseInt(d.overs||'6',10);
  state.err='';
  if(playersA.length<2 || playersB.length<2){ state.err='Add at least 2 players per team.'; render(); return; }
  if(!overs || overs<1){ state.err='Enter a valid number of overs.'; render(); return; }

  const code = genCode();
  const match = {
    code, createdAt:Date.now(), updatedAt:Date.now(),
    teamA:{name:teamAName, players:playersA},
    teamB:{name:teamBName, players:playersB},
    overs, status:'toss', currentInnings:0, result:'',
    tossWinner:null, tossDecision:null,
    innings:[]
  };
  state.match = match;
  state.code = code;
  state.isScorer = true;
  state.screen = 'toss';
  await saveMatch(match);
  render();
}

function startInnings(battingKey, bowlingKey, target){
  const inn = {
    battingTeam: battingKey, bowlingTeam: bowlingKey,
    totalRuns:0, wickets:0, legalBalls:0,
    extras:{wd:0,nb:0,b:0,lb:0},
    target: target,
    striker:null, nonStriker:null, currentBowler:null,
    previousBowler:null, needNewBowler:false,
    batsmen:{}, bowlers:{}, battingOrder:[],
    balls:[], thisOver:[], completed:false, _history:[]
  };
  return inn;
}

async function confirmToss(winner, decision){
  state.match.tossWinner = winner;
  state.match.tossDecision = decision;
  let battingKey, bowlingKey;
  if(decision==='bat'){ battingKey=winner; bowlingKey = winner==='A'?'B':'A'; }
  else { bowlingKey=winner; battingKey = winner==='A'?'B':'A'; }
  const inn = startInnings(battingKey, bowlingKey, null);
  state.match.innings = [inn];
  state.match.status='live';
  state.pending = {type:'OPENERS'};
  await saveMatch(state.match);
  render();
}

async function confirmOpeners(striker, nonStriker, bowler){
  const inn = curInnings();
  inn.striker = striker; inn.nonStriker = nonStriker; inn.currentBowler = bowler;
  inn.battingOrder = [striker, nonStriker];
  ensureBatsman(inn,striker); ensureBatsman(inn,nonStriker); ensureBowler(inn,bowler);
  state.pending = null;
  state.screen = 'score';
  await saveMatch(state.match);
  render();
}

async function startSecondInnings(){
  const inn0 = state.match.innings[0];
  const battingKey = inn0.bowlingTeam, bowlingKey = inn0.battingTeam;
  const target = inn0.totalRuns + 1;
  const inn1 = startInnings(battingKey, bowlingKey, target);
  state.match.innings.push(inn1);
  state.match.currentInnings = 1;
  state.match.status='live';
  state.pending = {type:'OPENERS'};
  await saveMatch(state.match);
  render();
}

/* ---------------- render root ---------------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='home') html = renderHome();
  else if(state.screen==='setup') html = renderSetup();
  else if(state.screen==='join') html = renderJoin();
  else if(state.screen==='toss') html = renderToss();
  else if(state.screen==='score') html = renderScore();
  else if(state.screen==='watch') html = renderWatch();
  else if(state.screen==='result') html = renderResult();
  else html = renderHome();

  if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';
  app.innerHTML = html;
  bindGlobalHandlers();
}

function bindGlobalHandlers(){
  const brand = document.querySelector('.brand');
  if(brand) brand.onclick = goHome;
}

function renderScore(){
  const m = state.match;
  if(m.status==='break') return renderBreak();
  if(m.status==='completed') { state.screen='result'; return renderResult(); }
  const inn = curInnings();
  if(!inn || !inn.striker){ return renderOpenersPanel(); }

  const bat = battingTeam(inn), bowl = bowlingTeam(inn);
  const req = inn.target!=null ? Math.max(inn.target - inn.totalRuns,0) : null;
  const ballsLeft = inn.target!=null ? (m.overs*6 - inn.legalBalls) : null;
  const reqRR = (req!=null && ballsLeft>0) ? (req/(ballsLeft/6)).toFixed(2) : null;

  let pendingHtml = '';
  if(state.pending){
    if(state.pending.type==='WD_RUNS' || state.pending.type==='NB_RUNS' || state.pending.type==='B_RUNS' || state.pending.type==='LB_RUNS'){
      const label = {WD_RUNS:'Wide — extra runs run?', NB_RUNS:'No ball — runs off the bat?', B_RUNS:'Byes — how many run?', LB_RUNS:'Leg byes — how many run?'}[state.pending.type];
      pendingHtml = `<div class="subpanel"><h4>${label}</h4><div class="chiprow">
        ${[0,1,2,3,4].map(n=>`<button class="chip-opt" onclick="app.finishExtra(${n})">${n}</button>`).join('')}
      </div></div>`;
    } else if(state.pending.type==='WICKET_TYPE'){
      const types = ['Bowled','Caught','LBW','Run Out','Stumped','Hit Wicket'];
      pendingHtml = `<div class="subpanel"><h4>How out?</h4><div class="chiprow">
        ${types.map(t=>`<button class="chip-opt" onclick="app.wicketType('${t}')">${t}</button>`).join('')}
      </div></div>`;
    } else if(state.pending.type==='WICKET_END'){
      pendingHtml = `<div class="subpanel"><h4>Which batsman is out?</h4><div class="chiprow">
        <button class="chip-opt" onclick="app.wicketEnd('striker')">${esc(inn.striker)} (striker)</button>
        <button class="chip-opt" onclick="app.wicketEnd('nonStriker')">${esc(inn.nonStriker)} (non-striker)</button>
      </div></div>`;
    } else if(state.pending.type==='NEWBAT'){
      pendingHtml = `<div class="subpanel"><h4>Next batsman</h4><div class="chiprow">
        ${state.pending.pool.map(p=>`<button class="chip-opt" onclick="app.newBat('${esc(p)}')">${esc(p)}</button>`).join('')}
      </div></div>`;
    } else if(inn.needNewBowler){
      const options = bowl.players.filter(p=>p!==inn.previousBowler);
      pendingHtml = `<div class="subpanel"><h4>Who's bowling next over?</h4><div class="chiprow">
        ${options.map(p=>`<button class="chip-opt" onclick="app.newBowler('${esc(p)}')">${esc(p)}</button>`).join('')}
      </div></div>`;
    }
  } else if(inn.needNewBowler){
    const options = bowl.players.filter(p=>p!==inn.previousBowler);
    pendingHtml = `<div class="subpanel"><h4>Who's bowling next over?</h4><div class="chiprow">
      ${options.map(p=>`<button class="chip-opt" onclick="app.newBowler('${esc(p)}')">${esc(p)}</button>`).join('')}
    </div></div>`;
  }

  const strikerB = inn.batsmen[inn.striker] || newBatsman();
  const nonStrikerB = inn.batsmen[inn.nonStriker] || newBatsman();
  const bowlerB = inn.bowlers[inn.currentBowler] || newBowler();

  const disablePad = !!pendingHtml;

  return `
  <div class="topbar"><div class="brand">GULLY<span>.</span></div><button class="codepill" onclick="app.copyCode()">${esc(m.code)}</button></div>
  <div class="scoreboard">
    <div class="sb-teams">${esc(bat.name)} vs ${esc(bowl.name)} · Inn ${m.currentInnings+1}</div>
    <div class="sb-score">${inn.totalRuns}/${inn.wickets} <span class="ov">(${oversStr(inn.legalBalls)}/${m.overs} ov)</span></div>
    <div class="sb-meta">
      <span>RR <b>${runRate(inn.totalRuns, inn.legalBalls)}</b></span>
      <span>Extras <b>${inn.extras.wd+inn.extras.nb+inn.extras.b+inn.extras.lb}</b></span>
    </div>
    ${inn.target!=null ? `<div class="sb-target">Need ${req} off ${ballsLeft} balls ${ballsLeft>0?('· RRR '+reqRR):''}</div>` : ''}
  </div>

  <div class="batbowl">
    <div class="bb-row"><span class="bb-name ${inn.striker? 'striker':''}">${esc(inn.striker||'')}</span><span class="bb-stat">${strikerB.runs} (${strikerB.balls})</span></div>
    <div class="bb-row"><span class="bb-name">${esc(inn.nonStriker||'')}</span><span class="bb-stat">${nonStrikerB.runs} (${nonStrikerB.balls})</span></div>
    <div class="bb-row" style="border-top:1px solid var(--line-soft);margin-top:2px;padding-top:8px;">
      <span class="bb-name">${esc(inn.currentBowler||'')}</span>
      <span class="bb-stat">${oversStr(bowlerB.legalBalls)}-${bowlerB.runs}-${bowlerB.wickets}</span>
    </div>
  </div>

  <div class="overstrip">
    ${(inn.thisOver||[]).map(b=>ballChip(b)).join('') || '<span class="small muted">new over</span>'}
  </div>

  ${pendingHtml}

  <div class="pad" style="${disablePad?'opacity:0.35;pointer-events:none;':''}">
    <div class="pad-grid">
      <button class="pad-btn" onclick="app.run(0)">0</button>
      <button class="pad-btn" onclick="app.run(1)">1</button>
      <button class="pad-btn" onclick="app.run(2)">2</button>
      <button class="pad-btn" onclick="app.run(3)">3</button>
      <button class="pad-btn" onclick="app.run(4)">4</button>
      <button class="pad-btn" onclick="app.run(6)">6</button>
    </div>
    <div class="pad-row">
      <button class="pad-btn" onclick="app.extra('WD')">WIDE</button>
      <button class="pad-btn" onclick="app.extra('NB')">NO BALL</button>
      <button class="pad-btn" onclick="app.extra('B')">BYE</button>
      <button class="pad-btn" onclick="app.extra('LB')">LEG BYE</button>
    </div>
    <div class="pad-row" style="grid-template-columns:1fr;">
      <button class="pad-btn out" onclick="app.wicket()">OUT</button>
    </div>
  </div>
  <div class="pad-actions section">
    <button class="btn-small ghost" onclick="app.undo()">↺ Undo last ball</button>
    <button class="btn-small ghost" onclick="app.go('watch')">Full scorecard</button>
  </div>
  `;
}

function ballChip(b){
  if(b.wicket) return '<div class="ball-chip wicket">W</div>';

  if(b.runs===4) return '<div class="ball-chip four">4</div>';
  if(b.runs===6) return '<div class="ball-chip six">6</div>';
  return '<div class="ball-chip">'+b.runs+'</div>';
}

function renderWatch(){
  const m = state.match;
  if(!m) return '<div class="loading">loading…</div>';
  let body = '';
  m.innings.forEach((inn, idx)=>{
    const bat = battingTeam(inn), bowl = bowlingTeam(inn);
    body += `<div class="section-title">${esc(bat.name)} — ${inn.totalRuns}/${inn.wickets} <span class="muted" style="font-family:var(--font-b);font-size:13px;">(${oversStr(inn.legalBalls)} ov)</span></div>`;

    inn.battingOrder.forEach(p=>{
      const b = inn.batsmen[p] || newBatsman();
      const status = b.out ? (b.howOut + (b.howOut!=='Run Out' ? '' : '')) : (p===inn.striker || p===inn.nonStriker ? 'not out' : (b.balls>0?'retired':''));
      body += `<tr><td>${esc(p)}${!b.out && (p===inn.striker||p===inn.nonStriker)?' *':''}<div class="small muted">${esc(status)}</div></td><td class="num">${b.runs}</td><td class="num">${b.balls}</td><td class="num">${b.fours}</td><td class="num">${b.sixes}</td></tr>`;
    });
    body += `</tbody></table></div>`;
    body += `<div class="section"><table class="figs"><thead><tr><th>Bowling</th><th class="num">O</th><th class="num">R</th><th class="num">W</th></tr></thead><tbody>`;
    Object.keys(inn.bowlers).forEach(p=>{
      const b = inn.bowlers[p];
      body += `<tr><td>${esc(p)}</td><td class="num">${oversStr(b.legalBalls)}</td><td class="num">${b.runs}</td><td class="num">${b.wickets}</td></tr>`;
    });
    body += `</tbody></table></div>`;
    body += `<div class="section"><div class="small muted" style="margin-top:4px;">Extras: wd ${inn.extras.wd}, nb ${inn.extras.nb}, b ${inn.extras.b}, lb ${inn.extras.lb}</div></div>`;
  });

  const liveTag = m.status!=='completed' ? '<span class="livepulse"></span>LIVE' : 'FINAL';
  return `
  <div class="topbar"><div class="brand">GULLY<span>.</span></div><button class="codepill" onclick="app.copyCode()">${esc(m.code)}</button></div>

  ${body}
  <div class="section" style="margin-top:10px;">
    <button class="btn-small ghost" onclick="app.go('home')">Leave</button>
  </div>`;
}

/* ---------------- app controller (exposed to inline handlers) ---------------- */
const app = {
  go(screen){
    state.err='';
    if(screen==='setup'){ state.draft = {overs:'6'}; }
    if(screen==='watch' && !state.isScorer){ /* keep */ }
    if(screen==='watch') startWatchPoll(); else if(screen!=='watch') { /* keep polling only on watch for viewers */ if(!(state.isScorer)) {} }
    if(screen!=='watch') stopPoll();
    state.screen = screen;
    render();
  },
  async joinMatch(){
    const el = document.getElementById('joinCode');
    const code = (el.value||'').trim().toUpperCase();
    if(!code){ state.err='Enter a match code.'; render(); return; }
    const m = await getMatch(code);
    if(!m){ state.err='No match found with that code.'; render(); return; }
    state.match = m; state.code = code; state.isScorer=false; state.err='';
    state.screen='watch';
    startWatchPoll();
    render();
  },
  submitSetup(){
    state.draft = {
      overs: document.getElementById('f_overs').value,
      teamA: document.getElementById('f_teamA').value,
      teamB: document.getElementById('f_teamB').value,
      playersA: document.getElementById('f_playersA').value,
      playersB: document.getElementById('f_playersB').value
    };
    createMatch();
  },
  tossWinner(w){ confirmTossWinnerOnly(w); },
  tossDecision(dec){ confirmToss(state.match.tossWinner, dec); },
  pick(role, name){
    if(role==='striker') state.draft.striker = name;
    if(role==='nonStriker') state.draft.nonStriker = name;
    if(role==='bowler') state.draft.bowler = name;
    render();
  },
  confirmOpenersClick(){
    const d = state.draft;
    if(!d.striker || !d.nonStriker || !d.bowler){ state.err='Pick both batsmen and a bowler.'; render(); return; }
    if(d.striker===d.nonStriker){ state.err='Striker and non-striker must be different.'; render(); return; }
    state.err='';
    confirmOpeners(d.striker, d.nonStriker, d.bowler);
    state.draft = {};
  },
  run(n){ addRuns(n); },
  extra(type){
    state.pending = {type: type+'_RUNS'};
    render();
  },
  finishExtra(n){
    const type = state.pending.type.replace('_RUNS','');
    state.pending = null;
    addExtra(type, n);
  },
  wicket(){
    state.pending = {type:'WICKET_TYPE'};
    render();
  },
  wicketType(t){
    if(t==='Run Out'){ state.pending = {type:'WICKET_END', wtype:t}; render(); return; }
    confirmWicket(t, 'striker');
  },
  wicketEnd(end){
    confirmWicket(state.pending.wtype, end);
  },
  newBat(name){ pickNewBatsman(name); },
  newBowler(name){ pickNewBowler(name); },
  undo(){ undoLast(); },
  beginSecondInnings(){ startSecondInnings(); },
  copyCode(){
    const code = state.match ? state.match.code : state.code;
    if(navigator.clipboard){ navigator.clipboard.writeText(code).then(()=>toast('Code copied: '+code)).catch(()=>toast('Code: '+code)); }
    else toast('Code: '+code);
  }
};
window.app = app;

function confirmTossWinnerOnly(w){
  state.match.tossWinner = w;
  saveMatch(state.match);
  render();
}

/* ---------------- init ---------------- */
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

})();
</script>
</body>
</html>
